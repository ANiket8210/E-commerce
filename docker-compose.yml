services:
  server:
    container_name: e-commerce-server
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_LOCAL_URL: jdbc:postgresql://host.docker.internal:5432/ecommerce
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 8210
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
      SPRING_DATASOURCE_HIKARI_AUTO_COMMIT: false

  ui:
    container_name: e-commerce-ui
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:8080/api

volumes:
  postgres_data: